[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-refiner"
version = "0.1.0"
description = "LangGraph software requirements refinement laboratory"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "pydantic>=2,<3", "openai>=2,<3", "python-dotenv>=1,<2"]

[project.scripts]
requirements-refiner = "requirements_refiner.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
